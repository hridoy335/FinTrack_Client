<div class="auth-card">
  <div class="auth-card-badge" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z"/></svg>
  </div>

  <h1>Sign in</h1>
  <p class="auth-card-sub">Sign in to your FinTrack account</p>

  @if (errorMessage()) {
    <p class="ft-alert ft-alert--error">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth-field">
      <label for="userNameOrEmail">Username or email</label>
      <div class="auth-input">
        <span class="auth-input-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12zm0 2c-4.2 0-8 2.1-8 4.7V21h16v-2.3c0-2.6-3.8-4.7-8-4.7z"/></svg>
        </span>
        <input
          id="userNameOrEmail"
          formControlName="userNameOrEmail"
          autocomplete="username"
          placeholder="Enter your username or email"
        />
      </div>
    </div>

    <div class="auth-field">
      <label for="password">Password</label>
      <div class="auth-input">
        <span class="auth-input-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z"/></svg>
        </span>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
        />
        <button
          type="button"
          class="auth-eye"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24"><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 5-5 5 5 0 0 1-5 5zm0-8a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></svg>
          } @else {
            <svg viewBox="0 0 24 24"><path d="M2 4.3 3.3 3l18 18-1.3 1.3-3.1-3.1A12.7 12.7 0 0 1 12 19C5 19 2 12 2 12a20.4 20.4 0 0 1 5.2-5.9zm7.4 7.4A3 3 0 0 0 12 15a3 3 0 0 0 3-3 3 3 0 0 0-.3-1.3zM12 5c7 0 10 7 10 7a20.7 20.7 0 0 1-3.8 4.7l-1.5-1.5A12.4 12.4 0 0 0 20.9 12S18.2 7 12 7a10.6 10.6 0 0 0-3.3.5L6.9 5.7A13.4 13.4 0 0 1 12 5z"/></svg>
          }
        </button>
      </div>
    </div>

    <div class="auth-row">
      <label class="auth-remember">
        <input type="checkbox" formControlName="rememberMe" />
        Remember me
      </label>
      <a class="auth-forgot" href="#" (click)="$event.preventDefault()">Forgot password?</a>
    </div>

    <button type="submit" class="auth-submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <div class="auth-divider"><span>or</span></div>

  <p class="auth-switch">
    No account?
    <a routerLink="/auth/register">Register</a>
  </p>
</div>
