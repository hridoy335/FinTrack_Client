<div class="auth-card">
  <div class="auth-card-badge" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5z"/></svg>
  </div>

  <h1>Forgot password</h1>
  <p class="auth-card-sub">Enter your email and we’ll send a 6-digit recovery code.</p>

  @if (errorMessage()) {
    <p class="ft-alert ft-alert--error">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth-field">
      <label for="email">Email</label>
      <div class="auth-input">
        <span class="auth-input-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5z"/></svg>
        </span>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Enter your email"
        />
      </div>
    </div>

    <button type="submit" class="auth-submit" [disabled]="submitting()">
      {{ submitting() ? 'Sending…' : 'Send recovery code' }}
    </button>
  </form>

  <div class="auth-divider"><span>or</span></div>

  <p class="auth-switch">
    Remember your password?
    <a routerLink="/auth/login">Sign in</a>
  </p>
</div>
