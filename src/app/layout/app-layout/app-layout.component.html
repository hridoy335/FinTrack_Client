<div class="app-shell">
  <aside class="app-sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 19V5h2v14H4zm6 0V9h2v10h-2zm6 0V3h2v16h-2z"/></svg>
      </span>
      <div>
        <div class="brand-text">FinTrack</div>
        <div class="brand-tagline">Your Money, Your Control</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/app/dashboard" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6v7H4v-7zm10 0h6v7h-6v-7zM4 4h6v7H4V4zm10 0h6v7h-6V4z"/></svg>
        Dashboard
      </a>
      <span class="nav-item nav-item--soon" title="Coming soon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4V6zm2 2v8h12V8H6z"/></svg>
        Accounts
      </span>
      <span class="nav-item nav-item--soon" title="Coming soon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v2H7V4zm0 4h10v2H7V8zm0 4h7v2H7v-2z"/></svg>
        Transactions
      </span>
      <span class="nav-item nav-item--soon" title="Coming soon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v4H4V4zm0 6h10v2H4v-2zm0 4h14v2H4v-2z"/></svg>
        Budgets
      </span>
      <span class="nav-item nav-item--soon" title="Coming soon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 4.8L20 8l-4 3.9L17 18l-5-2.6L7 18l1-6.1L4 8l5.6-1.2L12 2z"/></svg>
        Goals
      </span>
      <span class="nav-item nav-item--soon" title="Coming soon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5h2v14H4zm5 0V11h2v8H9zm5 0V7h2v12h-2zm5 0V3h2v16h-2z"/></svg>
        Reports
      </span>
      <a routerLink="/app/profile" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-7 2-7 4v1h14v-1c0-2-3-4-7-4z"/></svg>
        Profile
      </a>
      <span class="nav-item nav-item--soon" title="Coming soon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 11h5v-2h-4V7h-2v6z"/></svg>
        Settings
      </span>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-premium">
        <div class="sidebar-premium-icon">💳</div>
        <strong>Go Premium</strong>
        <p>Unlock advanced reports and unlimited accounts.</p>
        <button type="button" class="sidebar-premium-btn" disabled>Upgrade Now</button>
      </div>

      <button type="button" class="sidebar-logout" (click)="logout()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17v-2h8v-7h-8V6l-5 5.5L10 17zM4 4h2v16H4V4z"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="topbar-actions">
        <button type="button" class="topbar-icon-btn" aria-label="Notifications" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-14 0v5l-2 2v1h18v-1l-2-2z"/></svg>
          <span class="topbar-badge"></span>
        </button>
        @if (user(); as u) {
          <div class="topbar-user">
            <div class="avatar">{{ u.firstName.charAt(0) }}</div>
            <div class="topbar-user-text">
              <strong>{{ displayName() }}</strong>
              <span>{{ u.currencyCode }}</span>
            </div>
          </div>
        }
      </div>
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
